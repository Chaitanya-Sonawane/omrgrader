<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
<meta name="theme-color" content="#3457D5" />
<!-- Force browsers/phones to always revalidate this app shell so a new deploy
     is never hidden behind an old cached copy of the page. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>OMR Grader</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Graphite & Scantron palette */
    --bg:#F4F5F1;              /* cool paper white */
    --surface:#FBFAF7;         /* card surface */
    --bg-grad-1:#3457D5;       /* kept as tokens: now solid scantron blue */
    --bg-grad-2:#3457D5;
    --ink:#1E2A3A;             /* graphite navy */
    --muted:#6B7280;
    --line:#E3E4DE;            /* soft paper border */
    --brand:#3457D5;           /* scantron blue */
    --brand-dark:#2942A8;
    --card:#FBFAF7;
    --green:#1B8A5A;           /* correct / pass / saved */
    --green-bg:#E3F2EA;
    --red:#C1443C;             /* wrong / error / offline */
    --red-bg:#F8E4E2;
    --amber:#B7791F;           /* review / blank */
    --amber-bg:#F6EEDD;
    --slate-bg:#EEEFEA;        /* subtle inset fill */
    --radius:8px;
    --shadow:0 1px 2px rgba(30,42,58,.06), 0 4px 14px rgba(30,42,58,.05);
    --shadow-lg:0 8px 28px rgba(30,42,58,.12);
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    --display:"Space Grotesk","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --safe-b:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; color:var(--ink);
    background:var(--bg);
    /* restrained scantron bubble texture: faint dot grid on exam paper */
    background-image:
      radial-gradient(rgba(52,87,213,.05) 1.4px, transparent 1.5px);
    background-size:22px 22px;
    background-position:0 0;
    background-attachment:fixed;
    font-family:var(--sans); font-size:16px; line-height:1.5;
    padding-bottom:calc(84px + var(--safe-b));
  }
  @media(min-width:860px){ body{ padding-bottom:0; } }

  /* ---------- header ---------- */
  header{
    background:var(--brand);
    color:#fff; padding:14px 18px 16px;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    box-shadow:0 1px 0 rgba(30,42,58,.12); position:sticky; top:0; z-index:40;
    border-bottom:1px solid rgba(255,255,255,.12);
  }
  header h1{ font-family:var(--display); font-size:19px; font-weight:700; margin:0; letter-spacing:-.5px; display:flex; align-items:center; gap:8px; }
  header h1 .logo{ font-size:20px; }
  header h1 span{ opacity:.8; font-weight:500; }
  header .tag{ font-size:11px; opacity:.85; text-transform:uppercase; letter-spacing:1.2px; font-weight:600; }

  main{ max-width:820px; margin:0 auto; padding:18px 16px 24px; }

  /* ---------- top step chips (desktop) ---------- */
  .tabs{ display:flex; gap:6px; margin-bottom:18px; background:var(--surface); padding:5px; border-radius:var(--radius); border:1px solid var(--line); box-shadow:var(--shadow); }
  .tab-btn{
    flex:1; font-family:var(--display); font-size:13.5px; font-weight:600; padding:11px 8px; border:none;
    background:transparent; color:var(--muted); cursor:pointer; border-radius:6px;
    transition:color .15s, background .15s; letter-spacing:-.2px;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .tab-btn .ico{ font-size:16px; }
  .tab-btn.active{ background:var(--brand); color:#fff; box-shadow:0 2px 6px rgba(52,87,213,.28); }
  .tab-btn:active{ transform:scale(.98); }

  /* ---------- bottom nav (mobile) ---------- */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:rgba(255,255,255,.96); backdrop-filter:saturate(180%) blur(12px);
    border-top:1px solid var(--line);
    display:flex; padding:6px 6px calc(6px + var(--safe-b));
  }
  .bottom-nav button{
    flex:1; background:none; border:none; cursor:pointer; padding:8px 4px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:11px; font-weight:600; color:var(--muted); border-radius:12px;
    transition:color .15s, background .15s;
  }
  .bottom-nav button .ico{ font-size:20px; line-height:1; }
  .bottom-nav button.active{ color:var(--brand); background:var(--slate-bg); box-shadow:inset 0 2px 0 var(--brand); }
  @media(min-width:860px){ .bottom-nav{ display:none; } }
  @media(max-width:859px){ .tabs{ display:none; } }

  /* ---------- panels / cards ---------- */
  .panel{ display:none; animation:fadeUp .35s ease both; }
  .panel.active{ display:block; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(12px);} to{ opacity:1; transform:none;} }

  .card{ background:var(--card); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:16px; border:1px solid var(--line); }
  h2{ font-family:var(--display); font-size:18px; font-weight:700; margin:0 0 4px; letter-spacing:-.4px; }
  .sub{ font-size:13.5px; color:var(--muted); margin:0 0 16px; }

  /* ---------- answer key grid ---------- */
  .grid-key{ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(20,auto); grid-auto-flow:column; gap:8px 12px; margin-bottom:18px; }
  .key-cell{ border:1px solid var(--line); border-radius:var(--radius); padding:9px 11px; background:var(--surface); display:flex; align-items:center; gap:10px; }
  .key-cell label{ font-family:var(--mono); font-size:12px; font-weight:600; color:var(--muted); display:block; min-width:30px; letter-spacing:-.3px; }
  .key-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .key-actions .primary, .key-actions .ghost{ flex:1 1 160px; }
  .opt-row{ display:flex; gap:8px; flex:1; justify-content:flex-end; }
  /* real scantron bubbles: circular option indicators */
  .opt-btn{
    width:34px; height:34px; flex:0 0 auto; font-family:var(--mono); font-size:13px; font-weight:600;
    cursor:pointer; border:1.5px solid var(--line); border-radius:50%; background:#fff; color:var(--muted);
    display:flex; align-items:center; justify-content:center; padding:0;
    transition:transform .1s, background .15s, color .15s, border-color .15s, box-shadow .15s;
  }
  .opt-btn:active{ transform:scale(.9); }
  .opt-btn.selected{ background:var(--brand); color:#fff; border-color:var(--brand); box-shadow:0 0 0 3px rgba(52,87,213,.18); }

  .row{ display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
  .field{ flex:1; min-width:150px; }
  .field label{ font-size:12.5px; font-weight:600; display:block; margin-bottom:6px; color:var(--muted); }
  .field input, .field textarea{
    font-family:var(--sans); font-size:16px; padding:12px 14px; border:1.5px solid var(--line);
    border-radius:var(--radius); width:100%; background:#fff; transition:border-color .15s, box-shadow .15s; color:var(--ink);
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(52,87,213,.15); }
  textarea#bulkKey{ width:100%; height:84px; resize:vertical; }

  /* ---------- buttons ---------- */
  button.primary{
    font-family:var(--display); font-size:15px; font-weight:600; width:100%; letter-spacing:-.2px;
    background:var(--brand); color:#fff; border:none;
    padding:14px 18px; border-radius:var(--radius); cursor:pointer; box-shadow:0 2px 8px rgba(52,87,213,.25);
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s, background .15s;
  }
  button.primary:hover{ background:var(--brand-dark); }
  button.primary:active{ transform:scale(.98); }
  button.primary:disabled{ background:#9aa6c9; box-shadow:none; cursor:default; }
  button.ghost{
    font-family:var(--display); font-size:13.5px; font-weight:600;
    background:transparent; border:1.5px solid var(--line); color:var(--ink);
    padding:11px 16px; border-radius:var(--radius); cursor:pointer; transition:transform .1s, border-color .15s, color .15s;
  }
  button.ghost:active{ transform:scale(.97); }
  button.ghost:hover{ border-color:var(--ink); color:var(--ink); }

  /* ---------- capture modes ---------- */
  .capture-modes{ display:flex; gap:10px; margin-bottom:16px; }
  .mode-card{
    flex:1; border:1.5px solid var(--line); border-radius:var(--radius); padding:16px 10px; text-align:center; cursor:pointer;
    background:#fff; transition:transform .12s, border-color .15s, background .15s;
  }
  .mode-card:active{ transform:scale(.97); }
  .mode-card.selected{ border-color:var(--brand); background:rgba(52,87,213,.06); box-shadow:inset 0 0 0 1px var(--brand); }
  .mode-card h3{ margin:6px 0 4px; font-family:var(--display); font-size:14.5px; font-weight:600; }
  .mode-card p{ margin:0; font-size:12px; color:var(--muted); }

  #videoWrap{ position:relative; width:100%; display:none; border-radius:var(--radius); overflow:hidden; }
  #video{ width:100%; display:block; }
  #liveOverlay{
    position:absolute; left:0; right:0; bottom:0; padding:12px 14px;
    background:linear-gradient(transparent, rgba(30,42,58,.88)); color:#fff; font-size:13px;
  }
  #liveMsg{ font-family:var(--display); font-weight:600; letter-spacing:.2px; }
  #liveMsg.ready{ color:#5fd39a; }
  #liveMeta{ font-family:var(--mono); font-size:11px; opacity:.85; margin-top:3px; }
  #confBar{ height:6px; background:rgba(255,255,255,.25); border-radius:4px; margin-top:8px; overflow:hidden; }
  #confFill{ height:100%; width:0%; background:var(--amber); transition:width .15s; }
  #confFill.ready{ background:#5fd39a; }
  #canvas{ display:none; }
  #preview{ width:100%; max-width:360px; border:1px solid var(--line); border-radius:var(--radius); margin-top:12px; display:none; box-shadow:var(--shadow); }
  #dropzone{
    border:2px dashed var(--line); border-radius:var(--radius); padding:36px 18px; text-align:center; cursor:pointer;
    color:var(--muted); font-size:14.5px; font-weight:500; background:var(--slate-bg); transition:border-color .15s, background .15s;
  }
  #dropzone .dz-ico{ font-size:34px; display:block; margin-bottom:8px; }
  #dropzone.drag{ border-color:var(--brand); background:rgba(52,87,213,.06); }
  .student-meta{ display:flex; gap:12px; margin:16px 0; flex-wrap:wrap; }

  /* ---------- scan status / loading ---------- */
  #scanStatus{ font-size:14px; margin-top:14px; }
  .status-line{ display:flex; align-items:center; gap:10px; padding:13px 16px; border-radius:var(--radius); background:var(--slate-bg); font-weight:600; }
  .status-line.err{ background:var(--red-bg); color:var(--red); }
  .status-line.ok{ background:var(--green-bg); color:var(--green); }
  .spinner{
    width:18px; height:18px; border:2.5px solid rgba(52,87,213,.25); border-top-color:var(--brand);
    border-radius:50%; animation:spin .7s linear infinite; flex-shrink:0;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- subject result cards ---------- */
  .score-hero{
    text-align:center; color:#fff; border-radius:var(--radius); padding:20px 18px; margin:16px 0;
    background:var(--brand); box-shadow:0 4px 16px rgba(52,87,213,.28);
    animation:pop .4s ease both;
  }
  @keyframes pop{ from{ opacity:0; transform:scale(.96);} to{ opacity:1; transform:none;} }
  .score-hero .big{ font-family:var(--mono); font-size:42px; font-weight:700; line-height:1; letter-spacing:-1px; }
  .score-hero .big small{ font-family:var(--mono); font-size:22px; opacity:.75; font-weight:500; }
  .score-hero .meta{ margin-top:8px; font-size:13.5px; opacity:.92; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; align-items:center; }
  .score-hero .meta > span{ font-family:var(--mono); }
  .score-hero .grade-pill{ display:inline-block; background:rgba(255,255,255,.2); padding:4px 12px; border-radius:6px; font-family:var(--display); font-weight:600; }

  /* ---------- compact inline scan result (shown right under upload) ---------- */
  .result-compact{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--brand);
    border-radius:var(--radius); padding:16px 18px; margin:16px 0 0; box-shadow:var(--shadow);
    animation:pop .35s ease both;
  }
  .result-compact .rc-score{ display:flex; align-items:baseline; gap:2px; font-family:var(--mono); }
  .result-compact .rc-score b{ font-size:34px; font-weight:700; color:var(--ink); letter-spacing:-1px; line-height:1; }
  .result-compact .rc-score small{ font-size:18px; color:var(--muted); font-weight:500; }
  .result-compact .rc-nums{ display:flex; gap:16px; flex-wrap:wrap; }
  .result-compact .rc-num{ display:flex; flex-direction:column; align-items:center; min-width:44px; }
  .result-compact .rc-num b{ font-family:var(--mono); font-size:18px; font-weight:700; line-height:1; }
  .result-compact .rc-num span{ font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:600; margin-top:4px; }
  .result-compact .rc-num.ok b{ color:var(--green); }
  .result-compact .rc-num.bad b{ color:var(--red); }
  .result-compact .rc-num.neutral b{ color:var(--muted); }
  .result-compact .rc-num.pct b{ color:var(--ink); }
  .result-compact .grade-badge{
    font-family:var(--display); font-weight:700; font-size:20px; color:#fff; background:var(--brand);
    width:52px; height:52px; border-radius:var(--radius); display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 8px rgba(52,87,213,.28); flex-shrink:0;
  }
  .result-compact .grade-badge.g-pass{ background:var(--green); box-shadow:0 2px 8px rgba(27,138,90,.28); }
  .result-compact .grade-badge.g-fail{ background:var(--red); box-shadow:0 2px 8px rgba(193,68,60,.28); }
  .result-head{ font-family:var(--display); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:2px 0 0; display:flex; align-items:center; gap:6px; }
  .result-who{ font-size:12.5px; color:var(--muted); margin-top:6px; font-family:var(--mono); }
  details.full-breakdown{ margin-top:12px; }
  details.full-breakdown > summary{ cursor:pointer; font-family:var(--display); font-weight:600; font-size:13.5px; color:var(--brand); padding:10px 0; list-style:none; display:flex; align-items:center; gap:6px; }
  details.full-breakdown > summary::-webkit-details-marker{ display:none; }
  details.full-breakdown > summary::before{ content:"\25B8"; transition:transform .2s; display:inline-block; }
  details.full-breakdown[open] > summary::before{ transform:rotate(90deg); }

  .subjects{ display:grid; grid-template-columns:1fr; gap:12px; margin:16px 0; }
  @media(min-width:560px){ .subjects{ grid-template-columns:1fr 1fr; } }
  .subject{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); animation:fadeUp .35s ease both; }
  .subject .top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .subject .name{ font-family:var(--display); font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px; }
  .subject .name .dot{ width:11px; height:11px; border-radius:50%; }
  .subject .frac{ font-family:var(--mono); font-size:20px; font-weight:700; }
  .subject .frac small{ font-size:13px; color:var(--muted); font-weight:600; }
  .bar{ height:9px; background:var(--slate-bg); border-radius:6px; overflow:hidden; }
  .bar > i{ display:block; height:100%; border-radius:6px; transition:width .6s ease; }
  .subject .brk{ margin-top:9px; font-size:11.5px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }

  details.qdetail{ margin-top:12px; }
  details.qdetail summary{ cursor:pointer; font-weight:600; font-size:13.5px; color:var(--brand); padding:6px 0; }
  .badge{ display:inline-block; padding:4px 9px; border-radius:6px; font-family:var(--mono); font-size:11.5px; font-weight:600; }
  .badge.correct{ background:var(--green-bg); color:var(--green); }
  .badge.wrong{ background:var(--red-bg); color:var(--red); }
  .badge.blank, .badge.multiple{ background:var(--amber-bg); color:var(--amber); }
  .badge.not_detected{ background:var(--slate-bg); color:var(--muted); }

  /* ---------- results table ---------- */
  .table-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius); border:1px solid var(--line); }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; background:#fff; min-width:520px; }
  th,td{ padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; }
  td{ font-variant-numeric:tabular-nums; }
  th{ font-family:var(--display); font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:600; background:var(--slate-bg); }
  tr:last-child td{ border-bottom:none; }
  .dash-stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:18px; }
  @media(min-width:560px){ .dash-stats{ grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); } }
  .stat{ background:#fff; border-radius:var(--radius); padding:14px 16px; box-shadow:var(--shadow); border:1px solid var(--line); }
  .stat .n{ font-family:var(--mono); font-size:24px; font-weight:700; color:var(--ink); letter-spacing:-.5px; }
  .stat .l{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; font-weight:600; margin-top:2px; }
  .export-row{ display:flex; gap:10px; margin:16px 0; flex-wrap:wrap; }
  .export-row button{ flex:1; min-width:130px; }
  #qgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:6px; margin-top:12px; font-size:11.5px; }
  #qgrid div{ padding:6px 2px; text-align:center; border-radius:6px; }
  .hint{ font-size:12.5px; color:var(--muted); margin-top:8px; display:block; }

  /* ---------- on-screen full question table ---------- */
  .qfull{ margin-top:8px; }
  .qfull h4{ font-family:var(--display); font-size:13.5px; margin:16px 0 6px; display:flex; align-items:center; gap:8px; font-weight:600; }
  .qfull h4 .cdot{ width:11px; height:11px; border-radius:50%; display:inline-block; }
  .qfull h4 small{ color:var(--muted); font-weight:600; }
  table.qtbl{ min-width:420px; }
  table.qtbl th, table.qtbl td{ text-align:center; padding:8px 10px; white-space:nowrap; }
  table.qtbl tr.st-correct td{ background:var(--green-bg); }
  table.qtbl tr.st-wrong td{ background:var(--red-bg); }
  table.qtbl tr.st-blank td, table.qtbl tr.st-multiple td, table.qtbl tr.st-not_detected td{ background:var(--amber-bg); }

  /* ---------- session sidebar ---------- */
  .icon-btn{ background:rgba(255,255,255,.16); border:none; color:#fff; font-size:18px; cursor:pointer;
    width:40px; height:40px; border-radius:var(--radius); display:flex; align-items:center; justify-content:center; }
  .icon-btn:active{ transform:scale(.95); }
  .header-right{ display:flex; align-items:center; gap:10px; }
  /* sync badge: color-coded state + small leading icon glyph */
  .sync-state{ font-family:var(--display); font-size:11px; font-weight:600; padding:5px 11px 5px 9px; border-radius:6px; background:rgba(255,255,255,.16); color:#fff; white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
  .sync-state::before{ font-family:var(--sans); font-weight:700; font-size:12px; line-height:1; }
  .sync-state.sync-saving{ background:var(--brand-dark); }
  .sync-state.sync-saving::before{ content:"\21BB"; animation:spin 1s linear infinite; }
  .sync-state.sync-saved{ background:var(--green); }
  .sync-state.sync-saved::before{ content:"\2713"; }
  .sync-state.sync-offline{ background:var(--red); }
  .sync-state.sync-offline::before{ content:"\26A0"; }
  .sync-state.sync-retry{ background:var(--red); }
  .sync-state.sync-retry::before{ content:"\21BB"; animation:spin 1s linear infinite; }
  #sidebarBackdrop{ position:fixed; inset:0; background:rgba(30,42,58,.45); z-index:60; display:none; }
  #sidebarBackdrop.show{ display:block; }
  #sessionSidebar{ position:fixed; top:0; left:0; bottom:0; width:300px; max-width:85vw; background:#fff; z-index:70;
    box-shadow:2px 0 24px rgba(30,41,59,.18); transform:translateX(-105%); transition:transform .25s ease;
    display:flex; flex-direction:column; }
  #sessionSidebar.open{ transform:translateX(0); }
  .sidebar-head{ padding:calc(16px + env(safe-area-inset-top,0px)) 16px 14px; background:var(--brand); color:#fff;
    display:flex; align-items:center; justify-content:space-between; }
  .sidebar-head h3{ margin:0; font-family:var(--display); font-size:16px; font-weight:600; }
  .sidebar-body{ flex:1; overflow-y:auto; padding:12px; }
  .sess-item{ display:flex; align-items:center; gap:8px; padding:12px; border-radius:var(--radius); cursor:pointer;
    border:1.5px solid var(--line); margin-bottom:8px; background:#fff; }
  .sess-item.active{ border-color:var(--brand); background:rgba(52,87,213,.06); box-shadow:inset 0 0 0 1px var(--brand); }
  .sess-main{ flex:1; min-width:0; }

<!-- Version query strings bust the browser cache on every UI release so the
     latest config/persistence JS is always fetched. Bump ?v= on each change. -->
<script src="config.js?v=20260801"></script>
<script src="firebase-config.js?v=20260801"></script>

<script>
// ---- API base resolution ----
// The backend normally serves this very page, so we prefer the SAME ORIGIN the
// app was loaded from. This makes local dev (uvicorn on :8000) and same-origin
// production work with zero config and no "Failed to fetch" surprises.
// window.OMR_API_BASE (config.js) is only a fallback used when the same origin
// has no backend (e.g. the UI is hosted on Netlify and the API lives on Render).
// A user can override the backend URL at runtime from the "Scanning server
// settings" panel; that choice is saved here and takes priority over the
// config.js fallback so a changed/unknown deployment URL never requires a code
// edit + redeploy.
const API_BASE_STORE = "omr_api_base_v1";
function getSavedApiBase(){
  try{ return (localStorage.getItem(API_BASE_STORE) || "").replace(/\/$/, ""); }
  catch(_){ return ""; }
}
function setSavedApiBase(v){
  try{
    if(v){ localStorage.setItem(API_BASE_STORE, v); }
    else { localStorage.removeItem(API_BASE_STORE); }
  }catch(_){}
}
// The configured fallback = a saved runtime override, else config.js value.
function configuredRemoteBase(){
  return getSavedApiBase() || ((typeof window !== "undefined" && window.OMR_API_BASE) || "").replace(/\/$/, "");
}
// Ordered list of backend URLs to try when same-origin has no API. A saved
// runtime override (from the settings panel) always comes first, then the
// optional config.js failover list, then the single config.js value. This lets
// the app survive a dead/changed primary URL as long as ANY listed host is live.
function candidateRemoteBases(){
  const list = [];
  const push = (v)=>{
    v = (v || "").replace(/\/$/, "");
    if(v && list.indexOf(v) === -1) list.push(v);
  };
  push(getSavedApiBase());
  const cands = (typeof window !== "undefined" && window.OMR_API_BASE_CANDIDATES) || [];
  if(Array.isArray(cands)) cands.forEach(push);
  push((typeof window !== "undefined" && window.OMR_API_BASE) || "");
  return list;
}
let _apiBase = null;
const sleep = (ms)=> new Promise(r=> setTimeout(r, ms));

// Some free tunnels/hosts (notably ngrok's free tier) intercept BROWSER
// requests and return an HTML "you are about to visit..." warning page instead
// of the real API response. Sending this header on every request skips that
// interstitial so we always get JSON back. It is harmless for other backends.
const API_HEADERS = {"ngrok-skip-browser-warning": "true"};
// Merge API_HEADERS into a caller-supplied fetch options object (non-mutating).
function withApiHeaders(opts){
  opts = opts || {};
  return Object.assign({}, opts, {headers: Object.assign({}, API_HEADERS, opts.headers || {})});
}

// Probe a base URL's /api/health once, with a hard timeout so a dead/asleep
// host can't hang the UI indefinitely.
async function probeHealth(base, timeoutMs){
  const ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  const t = ctrl ? setTimeout(()=> ctrl.abort(), timeoutMs) : null;
  try{
    const r = await fetch(base + "/api/health", {
      method:"GET", cache:"no-store", headers: API_HEADERS,
      signal: ctrl ? ctrl.signal : undefined,
    });
    // A same-origin static host (or a tunnel interstitial) can answer 200 with
    // an HTML page. Only treat it as a live API if it actually returns JSON.
    if(r.ok){
      const ct = (r.headers.get("content-type") || "").toLowerCase();
      if(ct.includes("application/json")) return true;
      try{ JSON.parse(await r.clone().text()); return true; }catch(_){ return false; }
    }
    return false;
  }catch(_){
    return false;
  }finally{ if(t) clearTimeout(t); }
}

async function getApiBase(){
  if(_apiBase !== null) return _apiBase;
  // 1. Prefer the origin that served this page, if it exposes the API.
  if(await probeHealth("", 4000)){ _apiBase = ""; return _apiBase; }
  // 2. Otherwise probe each configured remote backend and use the first that is
  //    actually live. This auto-fails-over if the primary URL is dead/changed.
  const candidates = candidateRemoteBases();
  for(const base of candidates){
    if(await probeHealth(base, 5000)){ _apiBase = base; return _apiBase; }
  }
  // 3. None answered right now (e.g. all asleep). Keep the first configured base
  //    so the wake-up polling can still try to revive it.
  _apiBase = candidates[0] || "";
  return _apiBase;
}
// Force API base re-resolution (e.g. after the user saves a new server URL).
function resetApiBase(){ _apiBase = null; }

// Free hosts (e.g. Render free tier) sleep when idle and take ~30-60s to wake.
// Rather than failing on the first request, wake the backend by polling its
// health endpoint with backoff. Returns true once it responds, false on giving
// up. `onProgress` (optional) receives a human-readable status line.
async function ensureBackendAwake(onProgress){
  const base = await getApiBase();
  if(await probeHealth(base, 5000)) return true;
  const deadline = Date.now() + 75000;   // wake budget ~75s
  let attempt = 0;
  while(Date.now() < deadline){
    attempt++;
    if(onProgress) onProgress("Waking the scanning server\u2026 (attempt " + attempt + ")");
    await sleep(Math.min(5000, 1500 + attempt * 1000));
    if(await probeHealth(base, 8000)) return true;
  }
  return false;
}

// Build a full API URL for a given path (resolving the base first).
async function apiUrl(path){ return (await getApiBase()) + path; }

// fetch() wrapper that transparently retries transient failures typical of a
// waking/cold free host: bare network errors and 502/503/504 gateway errors.
// Non-transient responses (400/404/200 ...) are returned as-is on the first try.
async function fetchWithRetry(url, opts, onProgress, tries){
  tries = tries || 3;
  let lastErr = null;
  for(let i = 0; i < tries; i++){
    try{
      const res = await fetch(url, withApiHeaders(opts));
      if(res.status === 502 || res.status === 503 || res.status === 504){
        if(i < tries - 1){
          if(onProgress) onProgress("Server is starting up, retrying\u2026");
          await sleep(3000 + i * 2000);
          continue;
        }
      }
      return res;
    }catch(err){
      lastErr = err;
      if(i < tries - 1){
        if(onProgress) onProgress("Connection failed, retrying\u2026 (" + (i + 2) + "/" + tries + ")");
        await sleep(2500 + i * 2000);
      }
    }
  }
  throw lastErr;
}

// Turn low-level fetch/network failures into a clear, actionable message.
// A bare `fetch` rejection (TypeError "Failed to fetch") means the request never
// reached a server: backend down/asleep, wrong URL, CORS, or offline.
function friendlyFetchError(err){
  const msg = (err && err.message) || String(err);
  const isNetwork = err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(msg);
  if(isNetwork){
    // Report the base we actually resolved to (same-origin or the configured
    // remote), so the message points at the real target instead of only the
    // remote fallback.
    const tried = (_apiBase !== null && _apiBase !== "") ? _apiBase : configuredRemoteBase();
    const where = tried ? (" (tried " + tried + ")") : "";
    return "Cannot reach the scanning server" + where + ". " +
      "Please check your internet connection and that the backend is running, then try again. " +
      "If it was just deployed on a free host it may be waking up - retry in ~30s.";
  }
  return msg;
}

let selectedFile = null;
let stream = null;

// Safely parse a fetch Response as JSON. If the server returns HTML (e.g. a
// Netlify 404 page because OMR_API_BASE isn't pointed at the backend, or the
// backend returned an error page), don't blow up with the cryptic
// "Unexpected token '<'" error - surface a clear, actionable message instead.
async function parseJSON(res){
  const text = await res.text();
  try{
    return JSON.parse(text);
  }catch(_){
    const body = (text || "").trim();
    const looksHtml = body.startsWith("<");
    // Render returns a plain-text "Not Found" with header
    // `x-render-routing: no-server` when no backend service is running at the
    // configured URL - the single most common reason scanning "doesn't work".
    const noServer = /not found/i.test(body) || res.status === 404;
    const base = (typeof window !== "undefined" && window.OMR_API_BASE) || "(same origin)";
    if(noServer || looksHtml){
      throw new Error(
        "Can't reach the backend API at " + base + " (got a \"" +
        (body.slice(0, 40) || res.status) + "\" response, not data). " +
        "Make sure the backend service is deployed and running, and that " +
        "OMR_API_BASE in config.js points to its live URL."
      );
    }
    throw new Error("Unexpected non-JSON response from the server (status " + res.status + ").");
  }
}

// ---- tabs (desktop chips + mobile bottom nav stay in sync) ----
function switchTab(tab){

// ---- answer key grid ----
const keyGrid = document.getElementById("keyGrid");
for(let q=1;q<=40;q++){
  const cell = document.createElement("div");
  cell.className = "key-cell";
  cell.innerHTML = `<label>Q${q}</label>

    </div>`;
  keyGrid.appendChild(cell);
}

// click an option to select it (click again to clear)
keyGrid.addEventListener("click", e=>{
  const btn = e.target.closest(".opt-btn");
  if(!btn) return;
  const row = btn.parentElement;
  const wasSelected = btn.classList.contains("selected");
  row.querySelectorAll(".opt-btn").forEach(b=>b.classList.remove("selected"));
  if(!wasSelected) btn.classList.add("selected");
});

function setKeyValue(q, a){
  const row = keyGrid.querySelector(`.opt-row[data-q="${q}"]`);
  if(!row || a<1 || a>4) return;
  row.querySelectorAll(".opt-btn").forEach(b=>
    b.classList.toggle("selected", parseInt(b.dataset.opt)===a));
}

// ---- persist the answer key locally so it survives page refresh ----
const KEY_STORE = "omr_answer_key_v1";
function collectKey(){
  const answers = {};
  keyGrid.querySelectorAll(".opt-row").forEach(row=>{
    const sel = row.querySelector(".opt-btn.selected");
    if(sel) answers[row.dataset.q] = parseInt(sel.dataset.opt);
  });
  const marks_per_correct = parseFloat(document.getElementById("marksPerCorrect").value)||1;
  const negative_marking = parseFloat(document.getElementById("negMarking").value)||0;
  return {answers, marks_per_correct, negative_marking};
}
function saveKeyLocal(payload){
  try{ localStorage.setItem(KEY_STORE, JSON.stringify(payload)); }catch(e){}
  // Store the key inside the active session too, so every session keeps its
  // own answer key and a brand-new session starts blank.
  try{ if(window.OMRSession && OMRSession.saveAnswerKey) OMRSession.saveAnswerKey(payload); }catch(_){}
}
// Wipe every selected option + inputs so the key grid is completely empty.
function clearKeyGrid(){
  keyGrid.querySelectorAll(".opt-btn.selected").forEach(b=> b.classList.remove("selected"));
  const bulk = document.getElementById("bulkKey");
  if(bulk) bulk.value = "";
}
// Paint a saved key payload onto the grid (used when opening a session).
function applyKeyPayload(payload){
  clearKeyGrid();
  if(!payload || !payload.answers){
    document.getElementById("keyStatus").textContent = "";
    return;
  }
  Object.keys(payload.answers).forEach(q=> setKeyValue(parseInt(q), parseInt(payload.answers[q])));
  if(payload.marks_per_correct != null) document.getElementById("marksPerCorrect").value = payload.marks_per_correct;
  if(payload.negative_marking != null) document.getElementById("negMarking").value = payload.negative_marking;
  document.getElementById("keyStatus").textContent =
    `Loaded this session's saved key (${Object.keys(payload.answers).length} answers).`;
  // Re-sync with the backend so scanning uses this session's key.
  syncKeyToServer(payload).catch(()=>{});
}
// Load the answer key for the currently active session (blank if none saved).
function loadKeyForSession(){
  let payload = null;
  try{ if(window.OMRSession && OMRSession.getActiveAnswerKey) payload = OMRSession.getActiveAnswerKey(); }catch(_){}
  // One-time migration: older builds kept a single global key. If the active
  // session's key is still empty, adopt that global key into this session so
  // upgrading users don't lose the key they already entered.
  const isEmptyKey = !payload || !payload.answers || !Object.keys(payload.answers).length;
  if(isEmptyKey){
    let legacy = null;
    try{ legacy = JSON.parse(localStorage.getItem(KEY_STORE)||"null"); }catch(_){ legacy = null; }
    if(legacy && legacy.answers){
      payload = legacy;
      try{ if(window.OMRSession && OMRSession.saveAnswerKey) OMRSession.saveAnswerKey(legacy); }catch(_){}
      try{ localStorage.removeItem(KEY_STORE); }catch(_){}   // don't leak into other sessions
    }
  }
  applyKeyPayload(payload);
}
async function syncKeyToServer(payload){
  const res = await fetch(await apiUrl("/api/answer-key"), withApiHeaders({
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(payload)
  }));
  return parseJSON(res);
}

// ---- camera + live auto-capture ----
const liveMsg = document.getElementById("liveMsg");
const liveMeta = document.getElementById("liveMeta");
const confFill = document.getElementById("confFill");
let liveTimer = null;            // frame-check loop handle
let checking = false;            // a frame-check request is in flight
let capturing = false;           // an auto-capture is being processed
const sessionId = "cam-" + Math.random().toString(36).slice(2);

async function openCamera(){
  // getUserMedia only exists in secure contexts (https / localhost). On mobile
  // over plain http it is undefined, which is the usual "camera won't open".
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if(!window.isSecureContext){
      throw new Error("Camera needs a secure (https) connection. Open the site over https.");
    }
    throw new Error("This browser does not support camera access.");
  }
  // Prefer the rear camera at a decent resolution, but keep every dimension as
  // an IDEAL (not exact) value so phones whose cameras can't do 1280x1280 don't
  // reject the request with OverconstrainedError. Fall back to any camera.
  const attempts = [
    {video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:1280}}},
    {video:{facingMode:{ideal:"environment"}}},
    {video:true},
  ];
  let lastErr = null;
  for(const constraints of attempts){
    try{
      return await navigator.mediaDevices.getUserMedia(constraints);
    }catch(err){
      lastErr = err;
      // Overconstrained/NotFound -> try a looser constraint set; anything else
      // (permission denied, no device) will fail the looser ones too, so stop.
      if(err && (err.name === "NotAllowedError" || err.name === "SecurityError")) break;
    }
  }
  throw lastErr || new Error("Unable to open camera");
}

document.getElementById("startCam").onclick = async ()=>{
  const btn = document.getElementById("startCam");
  btn.disabled = true;
  try{
    stream = await openCamera();
    const video = document.getElementById("video");
    video.srcObject = stream;
    // iOS Safari (and some Android browsers) need an explicit play() call even
    // with the autoplay attribute; ignore the harmless AbortError it may throw.
    try{ await video.play(); }catch(_){}
    document.getElementById("videoWrap").style.display="block";
    document.getElementById("snapCam").disabled = false;
    capturing = false;
    const fd = new FormData(); fd.append("session_id", sessionId);
    apiUrl("/api/frame-check/reset").then(u=>fetch(u, {method:"POST", body: fd})).catch(()=>{});
    startLiveLoop();
  }catch(err){
    const name = err && err.name ? err.name+": " : "";
    alert("Camera access failed: "+name+(err.message||err));
  }finally{
    btn.disabled = false;
  }
};

function grabFrame(maxDim, quality){
  const video = document.getElementById("video");
  if(!video.videoWidth) return Promise.resolve(null);
  const canvas = document.getElementById("canvas");
  const scale = Math.min(1, maxDim / Math.max(video.videoWidth, video.videoHeight));
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  return new Promise(res=>canvas.toBlob(res, "image/jpeg", quality));
}

function startLiveLoop(){
  stopLiveLoop();
  // ~15 checks/sec keeps the preview smooth and validation latency low;
  // overlapping requests are skipped so slow networks degrade gracefully.
  liveTimer = setInterval(async ()=>{
    if(checking || capturing || !stream) return;
    checking = true;
    try{
      const blob = await grabFrame(640, 0.7);
      if(!blob) return;
      const fd = new FormData();
      fd.append("file", blob, "frame.jpg");
      fd.append("session_id", sessionId);
      const res = await fetch(await apiUrl("/api/frame-check"), {method:"POST", body: fd});
      if(!res.ok) return;
      const q = await res.json();
      renderLive(q);
      if(q.is_ready && document.getElementById("autoCapture").checked && !capturing){
        capturing = true;
        stopLiveLoop();
        await doAutoCapture();
      }
    }catch(err){
      liveMsg.textContent = "Connection lost";
    }finally{
      checking = false;
    }
  }, 66);
}

function stopLiveLoop(){
  if(liveTimer){ clearInterval(liveTimer); liveTimer = null; }
}

function renderLive(q){
  const ready = q.is_ready;
  liveMsg.textContent = (q.messages && q.messages.length)? q.messages.join(" \u00b7 ") : "Checking\u2026";
  liveMsg.classList.toggle("ready", ready);
  confFill.style.width = q.confidence + "%";
  confFill.classList.toggle("ready", ready);
  const m = q.metrics || {};
  const parts = [`conf ${q.confidence}%`, `steady ${m.stability ?? 0}/20`];
  if(m.blur != null) parts.push(`sharp ${m.blur}`);
  if(m.tilt != null) parts.push(`tilt ${m.tilt}\u00b0`);
  liveMeta.textContent = parts.join("  \u00b7  ");
}

async function doAutoCapture(){
  liveMsg.textContent = "Capturing\u2026";
  const statusEl = document.getElementById("scanStatus");
  try{
    const blob = await grabFrame(2000, 0.95);   // full-quality capture frame
    if(!blob) throw new Error("no frame");
    selectedFile = new File([blob], "auto-capture.jpg", {type:"image/jpeg"});
    const preview = document.getElementById("preview");
    preview.src = URL.createObjectURL(blob);
    preview.style.display = "block";

    statusEl.textContent = "Auto-captured. Processing & scanning\u2026";
    const fd = new FormData();
    fd.append("file", selectedFile);
    fd.append("student_id", document.getElementById("studentId").value);
    fd.append("student_name", document.getElementById("studentName").value);
    const res = await fetch(await apiUrl("/api/auto-capture"), {method:"POST", body: fd});
    const data = await parseJSON(res);
    if(!res.ok){
      statusEl.textContent = "Auto-capture scan failed: "+(data.detail||JSON.stringify(data));
      capturing = false; startLiveLoop();
      return;
    }
    liveMsg.textContent = "Captured";
    renderScanResult(data, statusEl);
    stopCamera();
  }catch(err){
    statusEl.textContent = "Auto-capture failed: "+friendlyFetchError(err);
    capturing = false;
    startLiveLoop();
  }
}

// ---- subject grouping (frontend-only presentation) ----
// Questions are split into four fixed 10-question subjects. This is purely a
// display grouping over the backend's per-question results; no backend change.
const SUBJECTS = [
  {name:"Intelligence",    from:1,  to:10, color:"#3457D5"},
  {name:"Science",         from:11, to:20, color:"#0E7C86"},
  {name:"Social Science",  from:21, to:30, color:"#B7791F"},
  {name:"Mathematics",     from:31, to:40, color:"#1B8A5A"},
];

// Build per-subject stats from a scored result's question_results.
function groupBySubject(questionResults){
  return SUBJECTS.map(s=>{
    const qs = questionResults.filter(q=> q.question >= s.from && q.question <= s.to);
    const correct = qs.filter(q=> q.status === "correct").length;
    const wrong   = qs.filter(q=> q.status === "wrong").length;
    const blank   = qs.filter(q=> q.status === "blank" || q.status === "multiple" || q.status === "not_detected").length;
    return {...s, correct, wrong, blank, total: qs.length};
  });
}

let lastScanResult = null;   // kept so the per-sheet PDF can be regenerated

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c=>(
    {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function renderScanResult(data, statusEl){
  const out = document.getElementById("scanResult");
  if(data.scored === false){
    statusEl.className = "status-line";
    statusEl.textContent =
      "Scanned — no answer key set, so answers were detected but not scored. Set the key first to see the subject-wise result.";
    out.innerHTML = "";
    return;
  }

  lastScanResult = data;
  const groups = groupBySubject(data.question_results);
  const sid = document.getElementById("studentId").value || data.student_id || "";
  const sname = document.getElementById("studentName").value || data.student_name || "";

  statusEl.className = "status-line ok";
  statusEl.textContent = "✓ Scored successfully";

  // Hand the scored result to the persistence/session layer so it can be
  // autosaved and written into the selected student's Excel row. This is a
  // pure add-on; it never alters the scan/score data above.
  try{ if(window.OMRSession && window.OMRSession.onScored) window.OMRSession.onScored(data); }catch(_){}

  const subjectCards = groups.map(g=>{
    const pct = g.total ? Math.round(g.correct / g.total * 100) : 0;
    return `<div class="subject">
      <div class="top">
        <div class="name"><span class="dot" style="background:${g.color}"></span>${g.name}</div>
        <div class="frac">${g.correct}<small>/${g.total}</small></div>
      </div>
      <div class="bar"><i style="width:${pct}%; background:${g.color}"></i></div>
      <div class="brk">
        <span>✅ ${g.correct} correct</span>
        <span>❌ ${g.wrong} wrong</span>
        <span>⬜ ${g.blank} blank</span>
      </div>
    </div>`;
  }).join("");

  const badges = data.question_results.map(qr=>
    `<div class="badge ${qr.status}">Q${qr.question}:${qr.student_answer ?? "-"}</div>`).join("");

  // Full 40-question right/wrong table, grouped by subject, shown on screen.
  const optTxt = v => (v === null || v === undefined) ? "-" : v;
  const statusTxt = s => String(s || "").replace(/_/g," ").replace(/\b\w/g, c=>c.toUpperCase());
  const detailTables = groups.map(g=>{
    const qs = data.question_results
      .filter(q=> q.question >= g.from && q.question <= g.to)
      .sort((a,b)=> a.question - b.question);
    const qrows = qs.map(q=>`
      <tr class="st-${q.status}">
        <td>${q.question}</td>
        <td>${optTxt(q.correct_answer)}</td>
        <td>${optTxt(q.student_answer)}</td>
        <td>${statusTxt(q.status)}</td>
        <td>${q.marks}</td>
      </tr>`).join("");
    return `<h4><span class="cdot" style="background:${g.color}"></span>${g.name} <small>(Q${g.from}\u2013${g.to}) &middot; ${g.correct}/${g.total}</small></h4>
      <div class="table-wrap">
        <table class="qtbl">
          <thead><tr><th>Q#</th><th>Correct</th><th>Marked</th><th>Status</th><th>Marks</th></tr></thead>
          <tbody>${qrows}</tbody>
        </table>
      </div>`;
  }).join("");

  // Review banner: questions the scanner isn't confident about.
  const flags = data.flagged_questions || [];
  const reviewBanner = flags.length ? `
    <div class="review-flags">
      <b>⚠️ ${flags.length} question${flags.length===1?"":"s"} to double-check</b>
      <div class="flag-chips">${flags.map(f=>
        `<span class="flag-chip" title="${escapeHtml(f.reason)}">Q${f.question} · ${escapeHtml(f.reason)}</span>`
      ).join("")}</div>
    </div>` : "";

  // Pass/fail colour logic for the grade badge (green = pass, red = fail).
  const isPass = Number(data.percentage) >= 35;
  const gradeClass = isPass ? "g-pass" : "g-fail";
  const who = [sname ? escapeHtml(sname) : "", sid ? "#" + escapeHtml(sid) : ""].filter(Boolean).join("  ·  ");
  const totalBlank = data.blank + data.multiple + data.not_detected;

  // Compact inline result card: a few key numbers + a grade badge, shown right
  // below the upload area. The full subject/question breakdown is tucked into a
  // "View full breakdown" expander so the default view stays short.
  out.innerHTML = `
    ${reviewBanner}
    <div class="result-compact">
      <div>
        <div class="result-head">Scored result</div>
        <div class="rc-score"><b>${data.total_marks}</b><small>/${data.max_marks}</small></div>
        ${who ? `<div class="result-who">${who}</div>` : ""}
      </div>
      <div class="rc-nums">
        <div class="rc-num ok"><b>${data.correct}</b><span>Correct</span></div>
        <div class="rc-num bad"><b>${data.wrong}</b><span>Wrong</span></div>
        <div class="rc-num neutral"><b>${totalBlank}</b><span>Blank</span></div>
        <div class="rc-num pct"><b>${data.percentage}%</b><span>Score</span></div>
      </div>
      <div class="grade-badge ${gradeClass}" title="Grade ${escapeHtml(String(data.grade))}">${escapeHtml(String(data.grade))}</div>
    </div>

    <details class="full-breakdown">
      <summary>View full breakdown</summary>
      <div class="subjects">${subjectCards}</div>
      <div class="card">
        <h2 style="font-size:16px; margin:0 0 4px;">Question-by-question result</h2>
        <div class="qfull">${detailTables}</div>
      </div>
      <div class="card">
        <button class="primary" onclick="downloadResultPDF()">⬇️ Download result PDF</button>
        <details class="qdetail">
          <summary>Compact answer badges</summary>
          <div id="qgrid">${badges}</div>
        </details>
        <span class="hint">Quality: sharpness ${data.quality.blur_score}, brightness ${data.quality.brightness}, bubbles ${data.quality.bubbles_detected}/160.
        ${data.warnings.length ? "Warnings: "+escapeHtml(data.warnings.join("; ")) : ""}</span>
      </div>
    </details>`;
  out.scrollIntoView({behavior:"smooth", block:"start"});
}

      <div class="page-break"></div>
      <h2 class="detail-title">Question-by-question result (40 questions)</h2>
      <p class="info">
        ${sname ? `<b>Student name:</b> ${escapeHtml(sname)}<br>` : ""}
        ${sid ? `<b>Roll no. / ID:</b> ${escapeHtml(sid)}<br>` : ""}
      </p>
      ${detailBlocks}
      <script>window.onload=function(){setTimeout(function(){window.print();},250);};<\/script>
    </body></html>`;
  const w = window.open("", "_blank");
  if(!w){ alert("Please allow pop-ups to download the PDF."); return; }
  w.document.open(); w.document.write(html); w.document.close();
}

document.getElementById("snapCam").onclick = async ()=>{
  const blob = await grabFrame(2000, 0.92);
  if(!blob) return;
  selectedFile = new File([blob], "capture.jpg", {type:"image/jpeg"});
  const preview = document.getElementById("preview");
  preview.src = URL.createObjectURL(blob);
  preview.style.display = "block";
};

function stopCamera(){
  stopLiveLoop();
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  document.getElementById("videoWrap").style.display="none";
  document.getElementById("snapCam").disabled = true;
}

// ---- scan progress indicator ----
// Walks the status line through the scanning pipeline while the request is
// in-flight: Uploading -> Detecting Sheet -> Aligning -> Reading Answers ->
// Generating Results (-> Completed on success, shown by renderScanResult).
const SCAN_STEPS = ["Uploading", "Detecting sheet", "Aligning", "Reading answers", "Generating results"];
function setStatus(statusEl, text, kind, spinner){
  statusEl.className = "status-line" + (kind ? " " + kind : "");
  statusEl.innerHTML = (spinner ? '<span class="spinner"></span>' : "") +
    '<span>' + escapeHtml(text) + '</span>';
}
function startScanProgress(statusEl){
  let i = 0;
  setStatus(statusEl, SCAN_STEPS[0] + "\u2026", "", true);
  const t = setInterval(()=>{
    i = Math.min(i + 1, SCAN_STEPS.length - 1);
    setStatus(statusEl, SCAN_STEPS[i] + "\u2026", "", true);
  }, 600);
  return ()=>clearInterval(t);
}

// ---- scan & score ----
document.getElementById("scanBtn").onclick = async ()=>{
  if(!selectedFile){ alert("Choose or capture an image first."); return; }
  const statusEl = document.getElementById("scanStatus");
  const btn = document.getElementById("scanBtn");
  btn.disabled = true;
  let stopProgress = ()=>{};
  const fd = new FormData();
  fd.append("file", selectedFile);
  fd.append("student_id", document.getElementById("studentId").value);
  fd.append("student_name", document.getElementById("studentName").value);
  try{
    // Make sure a possibly-sleeping free-tier backend is awake before we upload,
    // so the request doesn't fail on a cold start.
    const awake = await ensureBackendAwake(msg=>{ setStatus(statusEl, msg, "", true); });
    if(!awake){
      setStatus(statusEl, friendlyFetchError(new TypeError("Failed to fetch")), "err", false);
      return;
    }
    stopProgress = startScanProgress(statusEl);
    const res = await fetchWithRetry(
      await apiUrl("/api/scan-and-score"), {method:"POST", body: fd},
      msg=>{ setStatus(statusEl, msg, "", true); },
    );
    const data = await parseJSON(res);
    stopProgress();
    if(!res.ok){ setStatus(statusEl, "Error: "+(data.detail||JSON.stringify(data)), "err", false); return; }
    renderScanResult(data, statusEl);
  }catch(err){
    stopProgress();
    setStatus(statusEl, "Request failed: "+friendlyFetchError(err), "err", false);
  }finally{
    btn.disabled = false;
  }
};

// Open an export (Excel/PDF) via the resolved API base in a new tab.
// The NMMS निकालपत्रक Excel is special: it POSTs this session's scanned marks
// so the four subject cells + एकूण auto-fill for each student, then downloads
// the returned workbook.
async function openExport(kind){
  try{
    if(kind === "nmms-template"){
      await downloadNmmsExcel();
      return;
    }
    window.open(await apiUrl("/api/export/"+kind), "_blank");
  }catch(err){
    alert(friendlyFetchError(err));
  }
}
async function downloadNmmsExcel(){
  const results = (window.OMRSession && window.OMRSession.getSessionResults)
    ? window.OMRSession.getSessionResults() : [];
  const res = await fetchWithRetry(
    await apiUrl("/api/export/nmms-template"),
    {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({results})},
  );
  if(!res.ok){ alert("Could not generate the NMMS Excel."); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "NMMS_Result_Test_4.xlsx";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}

// ---- scanning server settings (runtime backend URL override) ----
(function initServerSettings(){
  const input = document.getElementById("apiBaseInput");
  const statusEl = document.getElementById("apiBaseStatus");
  const saveBtn = document.getElementById("saveApiBase");
  const clearBtn = document.getElementById("clearApiBase");
  if(!input || !saveBtn) return;

  // Prefill with the currently-saved override (blank = use built-in default).
  input.value = getSavedApiBase();
  input.placeholder = ((typeof window !== "undefined" && window.OMR_API_BASE) || "https://your-backend.example.com");

  function normalize(v){
    v = (v || "").trim().replace(/\/$/, "");
    if(v && !/^https?:\/\//i.test(v)) v = "https://" + v;
    return v;
  }

  saveBtn.onclick = async ()=>{
    const url = normalize(input.value);
    setSavedApiBase(url);
    resetApiBase();                      // re-resolve on next request
    input.value = url;
    statusEl.textContent = "Testing " + (url || "same-origin / default") + "\u2026";
    statusEl.style.color = "#64748b";
    // Probe the newly-chosen backend so the user gets instant feedback.
    const target = url || (await getApiBase());
    const ok = await probeHealth(target, 8000);
    if(ok){
      statusEl.textContent = "\u2713 Connected. Scanning server is reachable.";
      statusEl.style.color = "#16a34a";
    }else{
      statusEl.textContent = "\u2717 Could not reach that server. Check the URL and that the backend is running (a free host may take ~30s to wake).";
      statusEl.style.color = "#dc2626";
    }
  };

  clearBtn.onclick = ()=>{
    setSavedApiBase("");
    resetApiBase();
    input.value = "";
    statusEl.textContent = "Reset to the built-in default. Reopen scan to reconnect.";
    statusEl.style.color = "#64748b";
  };
})();

// ---- results tab ----
async function loadResults(){
  const res = await fetch(await apiUrl("/api/results"), withApiHeaders());
  const data = await parseJSON(res);
  const dash = data.dashboard || {};
  const dashStats = document.getElementById("dashStats");
  dashStats.innerHTML = "";
  const items = [
    ["Scanned", dash.students_scanned ?? 0],
    ["Highest", dash.highest_marks ?? "-"],
    ["Lowest", dash.lowest_marks ?? "-"],
    ["Average", dash.average_marks ?? "-"],
    ["Pass %", dash.pass_percent!=null? dash.pass_percent+"%" : "-"],
  ];
  items.forEach(([l,n])=>{
    const d = document.createElement("div");
    d.className = "stat";
    d.innerHTML = `<div class="n">${n}</div><div class="l">${l}</div>`;
    dashStats.appendChild(d);
  });

  const tbody = document.querySelector("#resultsTable tbody");
  tbody.innerHTML = "";
  data.results.forEach(r=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.student_id||"-"}</td><td>${r.student_name||"-"}</td>
      <td>${r.correct}</td><td>${r.wrong}</td><td>${r.blank}</td>
      <td>${r.total_marks}</td><td>${r.percentage}%</td><td>${r.grade}</td>`;
    tbody.appendChild(tr);
  });
}

// When the teacher creates/switches a session, wipe every screen this file
// owns so nothing from the previous session lingers: the Scan panel (chosen
// image, scored result, status) and the Results panel (dashboard + table).
// persistence.js already clears its own bits (student fields, subject preview,
// assignInfo) and calls this hook.
function resetScreensForSession(){
  // --- Scan screen ---
  selectedFile = null;
  lastScanResult = null;
  const preview = document.getElementById("preview");
  if(preview){ preview.removeAttribute("src"); preview.style.display = "none"; }
  const scanResult = document.getElementById("scanResult");
  if(scanResult) scanResult.innerHTML = "";
  const scanStatus = document.getElementById("scanStatus");
  if(scanStatus){ scanStatus.textContent = ""; scanStatus.className = ""; }
  // --- Results screen ---
  const tbody = document.querySelector("#resultsTable tbody");
  if(tbody) tbody.innerHTML = "";
  const dashStats = document.getElementById("dashStats");
  if(dashStats) dashStats.innerHTML = "";
  // --- Answer key screen --- load THIS session's saved key (blank if none),
  // so a brand-new session starts with an empty key while a reopened session
  // restores exactly the key saved inside it.
  try{ loadKeyForSession(); }catch(_){}
}
try{
  window.OMRSession = window.OMRSession || {};
  window.OMRSession.onSessionChange = resetScreensForSession;
}catch(_){}

document.getElementById("clearResults").onclick = async ()=>{
  if(!confirm("Clear all scanned results?")) return;
  await fetch(await apiUrl("/api/results"), withApiHeaders({method:"DELETE"}));
  loadResults();
};
